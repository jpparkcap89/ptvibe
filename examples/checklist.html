<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>교사 연수 예제</title><link rel="stylesheet" data-app-font href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css"><style>
:root{--ink:#23364a;--muted:#657487;--blue:#4265cf;--line:#e3e8f0;--paper:#f6f8fc;--mint:#e8f5ee;--lavender:#eeedff}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Pretendard','Noto Sans KR',Arial,sans-serif;font-size:15px;line-height:1.65}button,input,select{font:inherit}button,a,input,select{outline-offset:4px}a{color:inherit}button{cursor:pointer}button:disabled{opacity:.6;cursor:wait}.wrap{width:85%;max-width:1280px;margin:auto}header{background:white;border-bottom:1px solid var(--line)}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 0}.brand{display:flex;align-items:center;gap:10px;font-weight:800}.logo{background:var(--blue);color:white;border-radius:12px;padding:7px 12px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--blue);font-weight:700}.pill{display:inline-block;border-radius:30px;background:var(--lavender);padding:4px 12px;font-size:12px;font-weight:700}nav{display:flex;gap:6px;overflow:auto;padding-bottom:13px}nav button{border:0;background:transparent;padding:9px 16px;border-radius:10px;white-space:nowrap;color:var(--muted);font-weight:700}nav button[aria-current=page]{background:#eaf0ff;color:var(--blue)}main{padding:24px 0 36px}.notice{background:#fff6df;border:1px solid #f0e4bf;border-radius:12px;padding:12px 18px;margin-bottom:24px;white-space:pre-wrap;font-size:13px}.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:32px;align-items:center;padding:12px 0 32px}h1{font-size:clamp(28px,3.1vw,44px);line-height:1.35;letter-spacing:-1.5px;margin:15px 0 16px}h2{font-size:24px;letter-spacing:-.8px;margin:0 0 9px}h3{margin:0 0 8px;font-size:17px}p{margin:0 0 12px}.muted{color:var(--muted)}.sub{font-size:16px;max-width:540px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:23px}.btn{display:inline-block;text-decoration:none;border:1px solid var(--line);border-radius:10px;background:white;padding:10px 17px;font-weight:700}.primary{background:var(--blue);color:white;border-color:var(--blue)}.scene{background:linear-gradient(135deg,#e8edff,#eaf6ee);border-radius:24px;padding:28px;position:relative}.window{background:white;border-radius:15px;border:1px solid #d9e2f0;box-shadow:0 16px 32px #5264a315;overflow:hidden}.bar{background:#f8f9fc;border-bottom:1px solid var(--line);padding:9px 14px;font-size:12px;color:var(--muted)}.mock{padding:20px}.bubble{background:#f1f3ff;border-radius:12px;padding:13px;font-size:13px;margin-bottom:13px}.mini{display:grid;grid-template-columns:1fr 1fr;gap:9px}.tile{border-radius:10px;background:#edf6f0;padding:12px;font-size:13px}.tile:nth-child(2){background:#fff3de}.scene-foot{display:flex;justify-content:space-between;font-size:12px;color:#54677e;margin-top:15px}.meta{display:grid;grid-template-columns:repeat(4,1fr);background:white;border:1px solid var(--line);border-radius:14px;margin-bottom:30px}.meta div{padding:16px 20px;border-right:1px solid var(--line)}.meta div:last-child{border:0}.meta small{display:block;color:var(--muted);margin-bottom:5px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.two{grid-template-columns:repeat(2,1fr)}.card{background:white;border:1px solid var(--line);border-radius:15px;padding:22px}.card p{font-size:14px;color:var(--muted)}.number{display:inline-block;color:var(--blue);font-size:12px;font-weight:800;margin-bottom:12px}.section-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:16px;gap:10px}.section-head p{margin:0;font-size:13px;color:var(--muted)}.page[hidden]{display:none}.page-heading{margin:5px 0 22px}.page-heading p{color:var(--muted)}.steps{padding-left:22px;margin:10px 0}.steps li{margin:10px 0}.tag{font-size:11px;padding:3px 8px;background:#edf1f8;border-radius:6px;margin-right:6px}.portrait{width:75px;height:75px;display:grid;place-items:center;background:var(--lavender);color:var(--blue);border-radius:20px;font-size:24px;font-weight:bold;margin-bottom:17px}.profile{display:grid;grid-template-columns:.8fr 1.2fr;gap:18px}.credentials{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}input,select{width:100%;padding:11px;border:1px solid #d3dce9;background:white;border-radius:9px;color:var(--ink)}input[type=checkbox]{width:18px;height:18px;flex-shrink:0;accent-color:var(--blue)}.check{display:flex;gap:9px;align-items:start;font-weight:400;margin:16px 0}.policy{font-size:13px;white-space:pre-wrap;background:#f5f7fb;padding:17px;border-radius:10px;margin-top:18px}.full{grid-column:1/-1}.status{font-size:13px;color:var(--muted);margin-top:12px}footer{border-top:1px solid var(--line);padding:18px 0;color:var(--muted);font-size:12px}.footer-row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#23364a;color:white;padding:13px 20px;border-radius:12px;box-shadow:0 8px 25px #23364a30;z-index:100;max-width:90%;white-space:pre-wrap}.toast:empty{display:none}dialog{border:0;border-radius:18px;padding:25px;max-width:650px;width:calc(100% - 30px);color:var(--ink);box-shadow:0 20px 80px #10213b35}dialog::backdrop{background:#14203880}.dialog-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:16px}.close{border:0;background:#f0f3f8;border-radius:8px;padding:4px 11px;font-size:20px}.task-row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.task-row input{width:18px;height:18px}.task-row span{flex:1}.task-row button{border:0;background:#f3f5f8;border-radius:6px}.inline{display:flex;gap:8px}.inline input{min-width:0}.inline button{white-space:nowrap}.word-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.word-list span{background:var(--lavender);padding:7px 12px;border-radius:10px}code{background:#eef2f9;padding:2px 5px;border-radius:4px;font-size:12px}.tip{background:var(--mint);border-radius:12px;padding:16px;margin-top:18px;font-size:14px}
@media(max-width:800px){.wrap{width:100%;padding:0 16px}.top{padding:16px 0}.top .pill{display:none}nav button{padding:8px 12px}.hero{grid-template-columns:1fr;gap:20px}.scene{padding:20px}.grid,.profile{grid-template-columns:1fr}.two{grid-template-columns:1fr}.meta{grid-template-columns:1fr 1fr}.meta div:nth-child(2){border-right:0}.meta div:nth-child(-n+2){border-bottom:1px solid var(--line)}.meta div{padding:12px}.form-grid{grid-template-columns:1fr}.card{padding:18px}.section-head{align-items:start;flex-direction:column}main{padding-top:17px}h1{letter-spacing:-1px}}

/* 부드러운 파스텔 디자인과 관리자 화면 */
:root{--ink:#273e46;--muted:#677b82;--blue:#7564c0;--line:#e5ecee;--paper:#f8fafb;--mint:#e8f4ed;--lavender:#f0edfa}
body{font-family:'Pretendard','Noto Sans KR',Arial,sans-serif;font-size:14px;line-height:1.75}.brand{font-weight:700}.eyebrow{letter-spacing:.5px;color:var(--muted)}.logo{background:var(--lavender);color:var(--blue)}nav button{font-size:13px;font-weight:600}nav button[aria-current=page]{background:var(--lavender);color:var(--blue)}.card{border-radius:18px;box-shadow:0 4px 14px #273e4604}.btn{border-radius:11px;font-size:13px;font-weight:600;transition:transform .15s}.btn:hover{transform:translateY(-1px)}.primary{box-shadow:0 5px 14px #7161ba18}.scene{background:linear-gradient(135deg,var(--lavender),var(--mint))}.notice{background:#fff7e8;border-color:transparent;color:#677b82;font-size:12px}.sub{font-size:15px}.pill{font-size:11px;font-weight:600}h1{font-size:clamp(28px,3.1vw,40px);font-weight:750}h2{font-size:22px}h3{font-size:16px}.number{font-weight:600}.meta{border-radius:16px}input,select,textarea{border-color:var(--line);background:#fbfcfe;border-radius:10px}textarea{font:inherit;color:var(--ink);width:100%;padding:11px;resize:vertical;min-height:76px}.admin-gear{display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;color:var(--muted);width:30px;height:30px;border-radius:8px;font-size:17px;margin-left:7px;vertical-align:middle}.admin-gear:hover{background:var(--lavender);color:var(--blue)}.admin-metrics{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}.admin-metrics span{background:var(--lavender);padding:8px 13px;border-radius:10px;font-size:13px}.admin-toolbar{display:flex;gap:8px;flex-wrap:wrap}.admin-details{white-space:pre-line}.admin-link-label{display:inline-flex;align-items:center}[data-content-key]{white-space:pre-line}
@media(max-width:800px){nav{flex-wrap:wrap;overflow:visible;gap:2px}nav button{font-size:12px}.form-grid{grid-template-columns:1fr}}
@media(pointer:coarse){input,select,textarea{font-size:16px}.admin-gear{width:44px;height:44px}}

.profile-photo{display:block;width:108px;height:108px;object-fit:contain;background:var(--lavender);border-radius:20px;border:1px solid var(--line);margin-bottom:17px}.profile-photo[hidden],.portrait[hidden]{display:none}
</style><body><main class="wrap"><h1>교사 연수 예제</h1><button id="start" class="btn primary">예제 열기</button></main><div id="toast" class="toast" role="status"></div><dialog id="modal"><div class="dialog-head"><h3 id="modalTitle"></h3><button id="closeModal" class="close" aria-label="닫기">×</button></div><div id="modalBody"></div></dialog><script>const $=id=>document.getElementById(id);let tasks=[];try{tasks=JSON.parse(localStorage.getItem('teacherLabTasks')||'[]');if(!Array.isArray(tasks))tasks=[]}catch(e){}let toastTimer;function toast(message){clearTimeout(toastTimer);$('toast').textContent=message;toastTimer=setTimeout(()=>{$('toast').textContent=''},5000)}function openModal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modal').showModal()}function example(kind){if(kind==='checklist'){openModal('수업 준비 체크','<p class="muted">이 브라우저에 저장합니다. 민감한 정보는 입력하지 마세요.</p><form id="taskForm" class="inline"><input id="taskInput" aria-label="새 할 일" maxlength="80" required placeholder="예: 수업 자료 출력"><button class="btn primary">추가</button></form><div id="taskList" style="margin-top:10px"></div>');taskList();$('taskForm').onsubmit=e=>{e.preventDefault();const text=$('taskInput').value.trim();if(!text)return;if(tasks.length>=50){toast('최대 50개까지 기록할 수 있습니다.');return}tasks.push({text,done:false});saveTasks();taskList();$('taskInput').value='';$('taskInput').focus();toast('추가했습니다.')};$('taskInput').focus()}else{openModal('다섯 글자 한마디','<p class="muted">공백을 제외한 다섯 글자로 마음을 표현해 보세요. 예: 오늘도행복</p><form id="wordForm" class="inline"><input id="wordInput" aria-label="다섯 글자 한마디" required maxlength="20"><button class="btn primary">등록</button></form><div class="word-list" id="wordList"></div>');$('wordForm').onsubmit=e=>{e.preventDefault();const value=$('wordInput').value.replace(/\s/g,'');if(Array.from(value).length!==5){toast('공백을 제외하고 다섯 글자로 입력해 주세요.');return}const span=document.createElement('span');span.textContent=value;$('wordList').append(span);$('wordInput').value='';toast('등록했습니다. 이 화면에서만 유지됩니다.')};$('wordInput').focus()}}
function taskList(){const list=$('taskList');list.replaceChildren();if(!tasks.length){list.textContent='할 일을 추가해 보세요.';return}tasks.forEach((t,i)=>{const row=document.createElement('div');row.className='task-row';const check=document.createElement('input');check.type='checkbox';check.checked=t.done;check.setAttribute('aria-label',t.text+' 완료');const span=document.createElement('span');span.textContent=t.text;span.style.textDecoration=t.done?'line-through':'none';check.onchange=()=>{t.done=check.checked;saveTasks();taskList()};const del=document.createElement('button');del.textContent='×';del.setAttribute('aria-label',t.text+' 삭제');del.onclick=()=>{tasks.splice(i,1);saveTasks();taskList();toast('삭제했습니다.')};row.append(check,span,del);list.append(row)})}
function saveTasks(){try{localStorage.setItem('teacherLabTasks',JSON.stringify(tasks))}catch(e){toast('브라우저 저장을 사용할 수 없습니다. 현재 화면에서만 유지됩니다.')}};document.getElementById('closeModal').onclick=()=>document.getElementById('modal').close();document.getElementById('start').onclick=()=>example('checklist');example('checklist');</script></body></html>
